name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Failure tails are re-emitted as ::error:: annotations (job logs need repo
# auth; annotations are public). All shell-scripted steps pin `shell: bash`
# because windows runners default to pwsh.
jobs:
  default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log || {
            grep -iE "^(error|warning)" clippy.log | head -25 | sed 's/^/::error::/'
            tail -25 clippy.log | sed 's/^/::error::/' ; exit 1; }
      - name: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.log || {
            grep -iE "^error|panicked|FAILED" test.log | head -25 | sed 's/^/::error::/'
            tail -25 test.log | sed 's/^/::error::/' ; exit 1; }

  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [camera, yolo, "yolo,camera"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # libclang-dev for bindgen (rtsp/yolo side); libv4l-dev because nokhwa's
      # linux input backend builds v4l2-sys-mit against kernel media headers.
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev libv4l-dev
      # config.toml points LIBCLANG_PATH at the windows-only vendor wheel;
      # on linux override with the apt path (force=false lets env win)
      - name: point bindgen at system libclang
        shell: bash
        run: echo "LIBCLANG_PATH=$(dirname "$(ls /usr/lib/llvm-*/lib/libclang.so | head -1)")" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --features "${{ matrix.features }}" -- -D warnings 2>&1 | tee clippy.log || {
            grep -iE "^error|failed" clippy.log | head -25 | sed 's/^/::error::/'
            tail -25 clippy.log | sed 's/^/::error::/' ; exit 1; }
      - name: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --features "${{ matrix.features }}" 2>&1 | tee test.log || {
            grep -iE "^error|panicked|FAILED" test.log | head -25 | sed 's/^/::error::/'
            tail -25 test.log | sed 's/^/::error::/' ; exit 1; }

  rtsp-zip:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: libclang (linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y libclang-dev
          echo "LIBCLANG_PATH=$(dirname "$(ls /usr/lib/llvm-*/lib/libclang.so | head -1)")" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: xtask setup (pinned zip path)
        shell: bash
        run: |
          set -o pipefail
          cargo xtask setup 2>&1 | tee setup.log || {
            grep -iE "^error|mismatch|failed|GET " setup.log | head -25 | sed 's/^/::error::/'
            tail -30 setup.log | sed 's/^/::error::/' ; exit 1; }
      - run: cargo xtask status
      - name: test
        shell: bash
        run: |
          set -o pipefail
          # BtbN's linux .so files carry no RUNPATH of their own, and a binary's
          # DT_RUNPATH does not cover its libraries' dependencies, so the loader
          # needs the directory explicitly.
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            export LD_LIBRARY_PATH="$PWD/target/vendor/ffmpeg/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          cargo test --workspace --features rtsp 2>&1 | tee test.log || {
            grep -iE "^error|panicked|FAILED|shared object" test.log | head -30 | sed 's/^/::error::/'
            tail -30 test.log | sed 's/^/::error::/'
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              bin=$(ls -t target/debug/deps/item_ingest-* 2>/dev/null | grep -v '\.d$' | head -1)
              { echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
                ls -la target/vendor/ffmpeg/lib | head -40
                [ -n "$bin" ] && readelf -d "$bin" | grep -E 'NEEDED|RUNPATH|RPATH'
                [ -n "$bin" ] && ldd "$bin" | grep -E 'av|sw|not found'
              } 2>&1 | sed 's/^/::error::diag: /'
            fi
            exit 1; }

  # from-source builds of pinned FFmpeg. Linux only for now: Windows needs a
  # proven MSVC+MSYS2 configure handshake, macOS needs the brew/trust and
  # zip-conflict design pass (see README).
  rtsp-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev nasm make
      - name: point bindgen at system libclang
        shell: bash
        run: echo "LIBCLANG_PATH=$(dirname "$(ls /usr/lib/llvm-*/lib/libclang.so | head -1)")" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build ffmpeg from source
        shell: bash
        run: |
          set -o pipefail
          cargo xtask setup --from-source 2>&1 | tee source-build.log || {
            grep -iE "^error|failed|cannot|No such|not found" source-build.log | head -30 | sed 's/^/::error::/'
            tail -40 source-build.log | sed 's/^/::error::/' ; exit 1; }
      - name: inspect source tree layout (public annotations, assert headers)
        shell: bash
        run: |
          set -uo pipefail
          SUMMARY=$(
            echo "== vendor root =="; ls target/vendor 2>&1
            echo "== ffmpeg top =="; ls target/vendor/ffmpeg 2>&1
            echo "== include/ =="; ls target/vendor/ffmpeg/include 2>&1
            echo "== avutil.h anywhere? =="; find target/vendor/ffmpeg -name avutil.h 2>/dev/null | head -3 || echo NONE
            echo "== header count =="; find target/vendor/ffmpeg -name '*.h' 2>/dev/null | wc -l
            echo "== libs =="; ls target/vendor/ffmpeg/lib 2>/dev/null | head -12 || echo "no lib/"
            echo "== manifest =="; cat target/vendor/ffmpeg/manifest.json 2>/dev/null | head -6 || echo "no manifest"
          )
          echo "$SUMMARY" | sed 's/^/::notice::/'
          # fail FAST here if headers are missing, with the full picture above
          if [ ! -f target/vendor/ffmpeg/include/libavutil/avutil.h ]; then
            echo "$SUMMARY" | sed 's/^/::error::tree:'
            echo "::error::source tree has no avutil.h -- make install layout issue"
            exit 1
          fi
      - name: test against source tree
        shell: bash
        run: |
          set -o pipefail
          # Downstream test binaries do not inherit item-ingest's linker rpath.
          export LD_LIBRARY_PATH="$PWD/target/vendor/ffmpeg/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          echo "::notice::at test: avutil.h=$(ls target/vendor/ffmpeg/include/libavutil/avutil.h 2>&1)"
          echo "::notice::PWD=$PWD"
          cargo test --workspace --features rtsp 2>&1 | tee test.log || {
            # gcc/cl error lines are prefixed by file:line:, so don't anchor ^
            grep -aiE "fatal error|no such file|undefined reference|cannot find|shared libraries|shared object|error\[|panicked|FAILED" test.log | head -25 | sed 's/^/::error::/'
            grep -aE "rustc-link-search|FFMPEG_DIR" test.log | head -6 | sed 's/^/::error::search:/'
            tail -30 test.log | sed 's/^/::error::/' ; exit 1; }

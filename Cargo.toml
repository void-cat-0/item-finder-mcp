[workspace]
resolver = "2"
members = ["crates/core", "crates/item-ingest", "crates/item-query", "crates/xtask", "crates/item-web", "crates/item-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
item-core = { path = "crates/core" }
item-query = { path = "crates/item-query" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled", "functions", "hooks", "limits"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "fs"] }
axum = "0.8"
reqwest = { version = "0.13", features = ["json"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = "0.25"
base64 = "0.22"
sha2 = "0.10"
rmcp = { version = "~3.5", default-features = false, features = ["server", "macros", "transport-io"] }

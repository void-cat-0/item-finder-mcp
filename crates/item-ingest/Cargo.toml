[package]
name = "item-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
item-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image.workspace = true
sha2.workspace = true
anyhow.workspace = true
clap.workspace = true
toml = "1"
font8x8 = "0.3.1"

# Optional backends, off by default so the skeleton builds without native deps:
# - ort: ONNX Runtime for real YOLO inference; auto-downloads onnxruntime at
#   build time (default feature). Note: all 1.16.x releases were yanked
#   upstream, hence the 2.0-rc pin; the yolo module is verified against it.
# - nokhwa: local/USB camera capture (no RTSP support; use rtsp feature)
[dependencies.ort]
version = "2.0.0-rc.13"
optional = true

[dependencies.nokhwa]
version = "0.10"
optional = true
default-features = false
features = ["input-native", "decoding"]

# RTSP/IP-camera frame source via FFmpeg (links native libav*; see README for
# the FFMPEG_DIR setup used on this machine). Features mirror what we actually
# use -- and, critically, what `xtask setup --from-source` installs: a
# minimized tree has NO libavdevice/avfilter, and ffmpeg-sys-next's probes
# fail at headers that aren't there.
[dependencies.ffmpeg-next]
version = "9"
optional = true
default-features = false
features = ["codec", "format", "software-scaling"]

# VLM grounding sidecar (OpenAI-compatible multimodal chat/completions over
# HTTP). Pure Rust, no system deps; blocking client because the Detector trait
# is sync and the camera loop runs on a plain thread (no tokio context).
[dependencies.reqwest]
workspace = true
optional = true
features = ["blocking"]

[dependencies.base64]
workspace = true
optional = true

# Streaming adapters for the MJPEG preview, which is the rtsp feature's
# (`preview.rs` is the only user), so they are optional too -- declaring them
# unconditionally would have cargo report them as unused in every build
# without `rtsp`.
[dependencies.tokio-stream]
version = "0.1"
features = ["sync"]
optional = true

[dependencies.futures-util]
version = "0.3"
optional = true

[dev-dependencies]
rusqlite.workspace = true
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
reqwest = { workspace = true, features = ["blocking"] }

[features]
default = []
yolo = ["dep:ort"]
camera = ["dep:nokhwa"]
rtsp = ["dep:ffmpeg-next", "dep:tokio-stream", "dep:futures-util"]
vlm = ["dep:reqwest", "dep:base64"]
relative-depth = ["dep:reqwest", "dep:base64"]
